name: CI

on:
  push:
    branches: [feature/airing-notifications]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # API keys aren't needed to compile or test; BuildConfig just gets empty strings.
      # roborazzi.test.record saves the headless screen renders so they can be checked from the run's artifacts.
      - name: Build and test
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug -Proborazzi.test.record=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload screen renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trackr-debug
          path: app/build/outputs/apk/debug/*.apk
