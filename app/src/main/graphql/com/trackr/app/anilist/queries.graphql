fragment MediaFields on Media {
  id
  format
  status
  isAdult
  title { romaji english }
  coverImage { extraLarge large }
  bannerImage
  averageScore
  episodes
  duration
  seasonYear
  startDate { year }
  genres
  studios(isMain: true) { nodes { name } }
  nextAiringEpisode { episode airingAt }
}

query BrowseAnime($page: Int = 1, $perPage: Int = 20, $sort: [MediaSort] = [TRENDING_DESC]) {
  Page(page: $page, perPage: $perPage) {
    pageInfo { hasNextPage }
    media(type: ANIME, sort: $sort, isAdult: false) { ...MediaFields }
  }
}

query AiringThisWeek($from: Int!, $to: Int!, $perPage: Int = 30) {
  Page(page: 1, perPage: $perPage) {
    airingSchedules(airingAt_greater: $from, airingAt_lesser: $to, sort: TIME) {
      airingAt
      episode
      media { ...MediaFields }
    }
  }
}

query SearchAnime($search: String!, $page: Int = 1, $perPage: Int = 20) {
  Page(page: $page, perPage: $perPage) {
    pageInfo { hasNextPage }
    media(type: ANIME, search: $search, sort: SEARCH_MATCH, isAdult: false) { ...MediaFields }
  }
}

query AnimeDetail($id: Int!) {
  Media(id: $id, type: ANIME) {
    ...MediaFields
    description(asHtml: false)
    season
    externalLinks { site url type icon color isDisabled }
    trailer { id site thumbnail }
    relations {
      edges {
        relationType(version: 2)
        node { type ...MediaFields }
      }
    }
    recommendations(sort: [RATING_DESC], perPage: 20) {
      nodes { mediaRecommendation { ...MediaFields } }
    }
    characters(sort: ROLE, perPage: 12) {
      edges {
        role
        node { name { full } image { medium } }
      }
    }
  }
}

query UserAnimeList($userName: String!, $chunk: Int!, $perChunk: Int = 500) {
  MediaListCollection(userName: $userName, type: ANIME, chunk: $chunk, perChunk: $perChunk) {
    hasNextChunk
    lists {
      isCustomList
      entries {
        status
        score(format: POINT_10)
        progress
        completedAt { year month day }
        media { ...MediaFields }
      }
    }
  }
}

query AnimeByMalIds($ids: [Int]!, $page: Int = 1) {
  Page(page: $page, perPage: 50) {
    pageInfo { hasNextPage }
    media(idMal_in: $ids, type: ANIME) { idMal ...MediaFields }
  }
}
